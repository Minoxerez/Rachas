<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis rachas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis rachas">
<meta name="theme-color" content="#E6ECE7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕊️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECE7; --bg2:#F3F6F2; --ink:#22332C; --soft:#5E6F67;
  --gold:#A87A2E; --lav:#6F74A0; --line:#C9D4CC; --track:#D5DED8;
  --danger:#9A4A3C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141C22; --bg2:#1C262D; --ink:#E7ECE6; --soft:#9DAAA3;
    --gold:#D9AE63; --lav:#A5A9D6; --line:#2E3B43; --track:#2A363D; --danger:#E08A78;
  }
}
:root[data-theme="dark"]{
  --bg:#141C22; --bg2:#1C262D; --ink:#E7ECE6; --soft:#9DAAA3;
  --gold:#D9AE63; --lav:#A5A9D6; --line:#2E3B43; --track:#2A363D; --danger:#E08A78;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:2.5rem 1.25rem 4rem}
.quote{text-align:center;padding:1.5rem .5rem 2.75rem}
.quote p{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(1.55rem,4.6vw,2.2rem);line-height:1.3;margin:0 auto;max-width:30ch;text-wrap:balance}
.quote cite{display:block;margin-top:1rem;font-style:normal;color:var(--gold);font-weight:600;letter-spacing:.02em}
.quote .date{color:var(--soft);font-size:.9rem;margin-bottom:1.25rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.25rem}
.counter{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:1.5rem 1.25rem 1.25rem;text-align:center}
.counter h2{font-size:1.05rem;font-weight:700;margin:0 0 1rem}
.ring{position:relative;width:190px;height:190px;margin:0 auto}
.ring svg{transform:rotate(-90deg);display:block}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:4.2rem;line-height:1}
.ring .unit{color:var(--soft);font-size:.95rem}
.ring circle.prog{transition:stroke-dashoffset .8s ease}
.meta{color:var(--soft);font-size:.92rem;margin:.9rem 0 .2rem}
.best{margin:.2rem 0 1.1rem;font-size:.95rem}
.best strong{color:var(--gold)}
.actions{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:600;border-radius:999px;padding:.6rem 1.1rem;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button:hover{border-color:var(--soft)}
button:focus-visible,input:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.warn{color:var(--danger)}
.panel{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line);text-align:left;font-size:.93rem}
.panel[hidden]{display:none}
.panel p{margin:0 0 .75rem}
.panel input{font:inherit;padding:.45rem .6rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;margin-bottom:.75rem}
.msg{text-align:center;color:var(--soft);font-size:.85rem;margin-top:2.5rem}
@media (prefers-reduced-motion: reduce){.ring circle.prog{transition:none}}
</style>
</head>
<body>
<main>
  <section class="quote" aria-live="polite">
    <div class="date" id="today"></div>
    <p id="qText"></p>
    <cite id="qAuthor"></cite>
  </section>

  <div class="grid" id="grid"></div>
  <div class="msg" id="msg">Cada día cuenta. Si caes, te levantas: la racha se reinicia, tu camino no.</div>
</main>

<script>
const QUOTES = [
 ["Quien mira hacia fuera, sueña; quien mira hacia dentro, despierta.","Carl Jung"],
 ["Uno no se ilumina imaginando figuras de luz, sino haciendo consciente la oscuridad.","Carl Jung"],
 ["Hasta que no hagas consciente lo inconsciente, dirigirá tu vida y lo llamarás destino.","Carl Jung"],
 ["Tu visión se aclarará solo cuando mires dentro de tu corazón.","Carl Jung"],
 ["Conoceréis la verdad, y la verdad os hará libres.","Jesús (Juan 8:32)"],
 ["Bienaventurados los limpios de corazón, porque ellos verán a Dios.","Jesús (Mateo 5:8)"],
 ["Velad y orad para no caer en tentación; el espíritu está dispuesto, pero la carne es débil.","Jesús (Mateo 26:41)"],
 ["No os afanéis por el mañana, que el mañana traerá su propio afán.","Jesús (Mateo 6:34)"],
 ["Pedid y se os dará; buscad y hallaréis; llamad y se os abrirá.","Jesús (Mateo 7:7)"],
 ["La lámpara del cuerpo es el ojo; si tu ojo es sano, todo tu cuerpo estará lleno de luz.","Jesús (Mateo 6:22)"],
 ["Venid a mí todos los que estáis cansados y cargados, y yo os haré descansar.","Jesús (Mateo 11:28)"],
 ["Mejor que conquistar mil veces a mil hombres es conquistarse a uno mismo.","Buda (Dhammapada)"],
 ["Somos lo que pensamos. Todo lo que somos surge con nuestros pensamientos.","Buda (Dhammapada)"],
 ["Como la lluvia entra en una casa mal techada, el deseo entra en una mente no cultivada.","Buda (Dhammapada)"],
 ["Nadie nos salva sino nosotros mismos. Nosotros debemos recorrer el camino.","Buda"],
 ["Gota a gota se llena el cántaro; poco a poco el sabio se llena de bien.","Buda (Dhammapada)"],
 ["Quien conoce a los demás es sabio; quien se conoce a sí mismo es iluminado.","Lao Tse"],
 ["Quien vence a otros es fuerte; quien se vence a sí mismo es poderoso.","Lao Tse"],
 ["Un viaje de mil millas comienza con un solo paso.","Lao Tse"],
 ["La herida es el lugar por donde entra la luz.","Rumi"],
 ["Lo que buscas te está buscando.","Rumi"],
 ["Tienes poder sobre tu mente, no sobre lo que sucede fuera. Date cuenta y encontrarás la fuerza.","Marco Aurelio"],
 ["No es libre quien no es dueño de sí mismo.","Epicteto"],
 ["Gobernarse a sí mismo es el mayor de los gobiernos.","Séneca"],
 ["Nuestro corazón está inquieto hasta que descansa en ti.","San Agustín"],
 ["Nada te turbe, nada te espante; la paciencia todo lo alcanza.","Santa Teresa de Jesús"],
 ["Mejor es el que domina su espíritu que el que conquista una ciudad.","Proverbios 16:32"],
 ["Todo lo puedo en aquel que me fortalece.","San Pablo (Filipenses 4:13)"],
 ["Cada mañana nacemos de nuevo. Lo que hacemos hoy es lo que más importa.","Buda"],
 ["El cuerpo es templo; cuídalo como se cuida lo sagrado.","San Pablo (1 Corintios 6:19, paráfrasis)"],
 ["Al final de la tarde se nos examinará en el amor.","San Juan de la Cruz"]
];

const COUNTERS = [
  {key:"porno", title:"Sin ver porno", color:"var(--gold)"},
  {key:"mast",  title:"Sin masturbarme", color:"var(--lav)"}
];
const MILESTONES=[1,3,7,14,30,60,90,180,365,730,1095];
const DAY=86400000, LS="rachas-v1", R=82, CIRC=2*Math.PI*R;

let state = {porno:{start:null,best:0}, mast:{start:null,best:0}};
let dbDoc = null;

try{ const s=localStorage.getItem(LS); if(s) state=Object.assign(state,JSON.parse(s)); }catch(e){}

function daysOf(c){ return c.start ? Math.max(0,Math.floor((Date.now()-c.start)/DAY)) : 0; }
function nextMilestone(d){ return MILESTONES.find(m=>m>d) || Math.ceil((d+1)/365)*365; }
function prevMilestone(d){ let p=0; for(const m of MILESTONES){ if(m<=d) p=m; } return p; }
function fmtDate(ms){ return new Date(ms).toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"}); }
function toInput(ms){ const d=new Date(ms); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }

async function save(){
  try{ localStorage.setItem(LS,JSON.stringify(state)); }catch(e){}
  if(dbDoc){ try{ await dbDoc.set(JSON.parse(JSON.stringify(state))); }catch(e){} }
}

function renderQuote(){
  const now=new Date();
  const start=new Date(now.getFullYear(),0,0);
  const doy=Math.floor((now-start)/DAY);
  const [t,a]=QUOTES[(doy*7+now.getFullYear())%QUOTES.length];
  document.getElementById("qText").textContent="«"+t+"»";
  document.getElementById("qAuthor").textContent=a;
  const d=now.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
  document.getElementById("today").textContent=d.charAt(0).toUpperCase()+d.slice(1);
}

function build(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  for(const c of COUNTERS){
    const el=document.createElement("article");
    el.className="counter"; el.id="c-"+c.key;
    el.innerHTML=`
      <h2>${c.title}</h2>
      <div class="ring">
        <svg width="190" height="190" viewBox="0 0 190 190" aria-hidden="true">
          <circle cx="95" cy="95" r="${R}" fill="none" stroke="var(--track)" stroke-width="10"/>
          <circle class="prog" cx="95" cy="95" r="${R}" fill="none" stroke="${c.color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/>
        </svg>
        <div class="num"><span class="big">0</span><span class="unit">días</span></div>
      </div>
      <p class="meta"></p>
      <p class="best"></p>
      <div class="actions"></div>
      <div class="panel" hidden></div>`;
    grid.appendChild(el);
  }
  render();
}

function render(){
  for(const c of COUNTERS){
    const s=state[c.key], el=document.getElementById("c-"+c.key);
    const d=daysOf(s);
    const best=Math.max(s.best||0,d);
    el.querySelector(".big").textContent=d;
    el.querySelector(".unit").textContent=d===1?"día":"días";
    const lo=prevMilestone(d), hi=nextMilestone(d);
    const pct=s.start?(d-lo)/(hi-lo):0;
    el.querySelector(".prog").style.strokeDashoffset=CIRC*(1-pct);
    const meta=el.querySelector(".meta"), actions=el.querySelector(".actions");
    if(s.start){
      const hrs=Math.floor(((Date.now()-s.start)%DAY)/3600000);
      meta.textContent=`Desde el ${fmtDate(s.start)} · ${hrs} h más · próxima meta: ${hi} días`;
      actions.innerHTML=`<button class="warn" data-a="reset">Reiniciar</button><button data-a="edit">Cambiar fecha</button>`;
    }else{
      meta.textContent="Aún no has empezado esta racha.";
      actions.innerHTML=`<button class="primary" data-a="start">Empezar hoy</button><button data-a="edit">Elegir fecha</button>`;
    }
    el.querySelector(".best").innerHTML=`Mejor racha: <strong>${best} ${best===1?"día":"días"}</strong>`;
    actions.querySelectorAll("button").forEach(b=>b.onclick=()=>act(c.key,b.dataset.a));
  }
}

function act(key,a){
  const el=document.getElementById("c-"+key), panel=el.querySelector(".panel"), s=state[key];
  if(a==="start"){ s.start=Date.now(); save(); render(); return; }
  if(a==="reset"){
    panel.hidden=false;
    panel.innerHTML=`<p>¿Reiniciar a 0? Tu racha de ${daysOf(s)} días se guardará si es la mejor.</p>
      <div class="actions"><button class="primary" data-x="ok">Sí, empezar de nuevo</button><button data-x="no">Cancelar</button></div>`;
  }
  if(a==="edit"){
    panel.hidden=false;
    const v=toInput(s.start||Date.now());
    panel.innerHTML=`<p>¿Qué día empezaste esta racha?</p>
      <input type="date" value="${v}" max="${toInput(Date.now())}">
      <div class="actions"><button class="primary" data-x="date">Guardar fecha</button><button data-x="no">Cancelar</button></div>`;
  }
  panel.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const x=b.dataset.x;
    if(x==="ok"){ s.best=Math.max(s.best||0,daysOf(s)); s.start=Date.now(); save(); }
    if(x==="date"){
      const val=panel.querySelector("input").value;
      if(val){ const [y,m,d]=val.split("-").map(Number); const t=new Date(y,m-1,d).getTime();
        s.start=Math.min(t,Date.now()); s.best=Math.max(s.best||0,daysOf(s)); save(); }
    }
    panel.hidden=true; panel.innerHTML=""; render();
  });
}

renderQuote(); build();
setInterval(()=>{ render(); renderQuote(); },60000);

(async()=>{
  try{
    if(!window.claude || !window.claude.use) return;
    const db=await window.claude.use("db");
    if(!db) return;
    dbDoc=db.doc("rachas/estado");
    const snap=await dbDoc.get();
    if(snap.exists){
      const data=snap.data();
      for(const k of ["porno","mast"]) if(data[k]) state[k]={start:data[k].start??null,best:data[k].best||0};
      try{ localStorage.setItem(LS,JSON.stringify(state)); }catch(e){}
      render();
    }else if(state.porno.start||state.mast.start){
      await save();
    }
  }catch(e){}
})();
</script>
</body>
</html>
